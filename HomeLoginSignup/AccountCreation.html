<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet" href="./AccountCreation.css">
</head>

<body>

    <div class="Account_Creation">

        <img src="../Images/logo.png" alt="TasteHaven Logo" width="100px">

        <h1>Create Account</h1>

        <input type="text" id="FullName" placeholder="Full Name">

        <br><br>

        <input type="text" id="Username" placeholder="Username">

        <br><br>

        <input type="email" id="Email" placeholder="Email">

        <br><br>

        <input type="password" id="Password" placeholder="Password">

        <br><br>

        <input type="password" id="ConfirmPassword" placeholder="Confirm Password">

        <br><br>

        <button class="Sign_In" id="CreateAccount" >Create Account</button>

        <p>
            Already have an account?
            <a href=""> <a target="_blank" href="./Login.html">Login</a></a>
        </p>

    </div>

    <script src="./AccountCreation.js"></script>
</body>

</html>
