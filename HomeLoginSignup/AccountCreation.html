<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet" href="./AccountCreation.css">
    <link rel="stylesheet" href="../shared/appFeedback.css">
</head>

<body>

    <div class="Account_Creation">

        <img src="../Images/logo.png" alt="TasteHaven Logo" width="100px">

        <h1>Create Account</h1>

        <form id="account-creation-form">
            <label for="FullName">Full name</label>
            <input type="text" id="FullName" placeholder="Full Name" autocomplete="name" required>

            <label for="Username">Username</label>
            <input type="text" id="Username" placeholder="Username" autocomplete="username" required>

            <label for="Email">Email address</label>
            <input type="email" id="Email" placeholder="Email" autocomplete="email" required>

            <label for="Password">Password</label>
            <input type="password" id="Password" placeholder="Password" autocomplete="new-password" minlength="8" required>

            <label for="ConfirmPassword">Confirm password</label>
            <input type="password" id="ConfirmPassword" placeholder="Confirm Password" autocomplete="new-password" minlength="8" required>

            <button class="Sign_In" id="CreateAccount" type="submit">Create Account</button>
        </form>

        <p>
            Already have an account?
            <a href="./Login.html">Login</a>
        </p>
        <p class="account-storage-note">Demo accounts are saved in this browser only. Do not use a password you use elsewhere.</p>

    </div>

    <script src="../shared/appFeedback.js"></script>
    <script src="../shared/customerAccounts.js"></script>
    <script src="./AccountCreation.js"></script>
</body>

</html>
