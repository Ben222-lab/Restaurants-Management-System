<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <link rel="stylesheet" href="./Login.css">
    <link rel="stylesheet" href="../shared/appFeedback.css">
</head>

<body>

    <div class="Login">

        <div class="Login_1">

            <h1>Welcome Back</h1>

            <p>Login to your account</p>

        </div>


        <form id="customer-login-form">
            <input type="text" id="Email" placeholder="Email address or username" autocomplete="username" required>
            <br><br>
            <input type="password" id="Password" placeholder="Password" autocomplete="current-password" required>
            <br><br>

            <button id="LoginButton" type="submit">Login</button>
        </form>


        <p>
            Don't have an account?
            <a href="./AccountCreation.html">Sign up</a>
        </p>


        <div class="Back_Home">
            <a href="../HomeLoginSignup/index.html">← Back to Home</a>
        </div>

    </div>


    <script src="../shared/appFeedback.js"></script>
    <script src="../shared/customerAccounts.js"></script>
    <script src="../shared/customerSession.js"></script>
    <script src="./Login.js"></script>

</body>

</html>
