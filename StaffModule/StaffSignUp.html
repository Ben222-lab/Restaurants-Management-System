<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taste Haven - Staff Sign Up</title>

    <link rel="stylesheet" href="StaffSignup.css">
</head>

<body>

    <div class="Staff_Signup">

        <div class="Signup_Logo">
            <img src="../Images/logo.png" alt="Taste Haven Logo">
        </div>

        <div class="Signup_Content">

            <h1>Staff Sign Up</h1>

            <p>Create your staff account</p>

            <form>

                <div class="Input_Group">

                    <label for="FullName">Full Name</label>

                    <input 
                        type="text" 
                        id="FullName" 
                        placeholder="Enter your full name"
                    >

                </div>


                <div class="Input_Group">

                    <label for="Username">Username</label>

                    <input 
                        type="text" 
                        id="Username" 
                        placeholder="Create a username"
                    >

                </div>


                <div class="Input_Group">

                    <label for="Email">Email Address</label>

                    <input 
                        type="email" 
                        id="Email" 
                        placeholder="Enter your email address"
                    >

                </div>


                <div class="Input_Group">

                    <label for="Phone">Phone Number</label>

                    <input 
                        type="tel" 
                        id="Phone" 
                        placeholder="Enter your phone number"
                    >

                </div>


                <div class="Input_Group">

                    <label for="Role">Staff Role</label>

                    <select id="Role">

                        <option value="">Select your role</option>

                        <option value="Waiter">Waiter</option>

                        <option value="Cashier">Cashier</option>

                        <option value="Chef">Chef</option>

                        <option value="Receptionist">Receptionist</option>

                    </select>

                </div>


                <div class="Input_Group">

                    <label for="Password">Password</label>

                    <input 
                        type="password" 
                        id="Password" 
                        placeholder="Create a password"
                    >

                </div>


                <div class="Input_Group">

                    <label for="ConfirmPassword">Confirm Password</label>

                    <input 
                        type="password" 
                        id="ConfirmPassword" 
                        placeholder="Confirm your password"
                    >

                </div>


                <div class="Show_Password">

                    <label>

                        <input type="checkbox" id="ShowPassword">

                        <span>Show Password</span>

                    </label>

                </div>


                <button type="submit" id="CreateAccount">
                    Create Staff Account
                </button>

            </form>


            <div class="Already_Account">

                <p>
                    Already have a staff account?
                    <a href="./StaffLogin.html">Login</a>
                </p>

            </div>


            <div class="Back_Home">

                <a href="../HomeLoginSignup/Home.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</body>

</html>
